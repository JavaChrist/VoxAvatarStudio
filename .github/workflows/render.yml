# Rendu d'une vidéo finale (détourage FFmpeg + montage Remotion), lancé par le serveur via l'API GitHub.
#
# Le dépôt est public : l'entrée et les logs sont visibles de tous. Seul l'identifiant du rendu passe ici ;
# le détail du travail est lu dans Storage par scripts/render-job.mjs, qui n'affiche aucune donnée privée.
#
# Secrets du dépôt :
#   RENDER_SERVICE_ACCOUNT  clé JSON d'un compte de service limité aux objets du bucket Storage
#   RENDER_BUCKET           nom du bucket Storage
name: Rendu vidéo
run-name: Rendu ${{ inputs.render_id }}

on:
  workflow_dispatch:
    inputs:
      render_id:
        description: Identifiant du rendu (le détail est dans Storage)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.render_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Vérifier l'identifiant
        working-directory: .
        env:
          RENDER_ID: ${{ inputs.render_id }}
        run: |
          if [[ ! "$RENDER_ID" =~ ^[A-Za-z0-9_-]{8,64}$ ]]; then
            echo "Identifiant de rendu invalide"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      # Bibliothèques de Chrome Headless Shell pour Ubuntu 24.04 : liste de remotion.dev/docs/miscellaneous/linux-dependencies.
      - name: Installer FFmpeg et les dépendances de Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 \
            libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0

      - name: Installer Remotion
        run: npm ci --no-audit --no-fund

      - name: Préparer Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Rendu
        env:
          RENDER_ID: ${{ inputs.render_id }}
          RENDER_BUCKET: ${{ secrets.RENDER_BUCKET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.RENDER_SERVICE_ACCOUNT }}
        run: node scripts/render-job.mjs
